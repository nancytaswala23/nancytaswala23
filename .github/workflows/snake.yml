name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#B9645B&color_dots=#EFE8DD,#C7D1A0,#9AA66E,#6E7A48,#4B5638
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#D98E83&color_dots=#2A201C,#4B5638,#6E7A48,#9AA66E,#C7D1A0

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
